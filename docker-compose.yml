version: '3.8'

services:
  # ─────────────────────────────────────────────
  # Nginx Reverse Proxy for Laravel API
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: lernyxa-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      api:
        condition: service_started
    networks:
      - lernyxa

  # ─────────────────────────────────────────────
  # Laravel API (PHP-FPM)
  # ─────────────────────────────────────────────
  api:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: lernyxa-api
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
    networks:
      - lernyxa

  # ─────────────────────────────────────────────
  # Laravel Queue Worker (Horizon)
  # ─────────────────────────────────────────────
  worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: lernyxa-worker
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    command: php artisan queue:work redis --queue=high,default,low --sleep=3 --tries=3 --max-time=3600
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - lernyxa

  # ─────────────────────────────────────────────
  # Next.js Frontend (Dev Server)
  # ─────────────────────────────────────────────
  web:
    image: node:24-alpine
    container_name: lernyxa-web
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    depends_on:
      - nginx
    networks:
      - lernyxa

  # ─────────────────────────────────────────────
  # PostgreSQL 16 (Local Development)
  # Production uses Supabase managed Postgres
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lernyxa-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lernyxa
      POSTGRES_USER: lernyxa
      POSTGRES_PASSWORD: lernyxa_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lernyxa -d lernyxa"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - lernyxa

  # ─────────────────────────────────────────────
  # Redis 7 (Cache, Queues, Sessions, Rate Limiting)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lernyxa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lernyxa

  # ─────────────────────────────────────────────
  # MinIO (Local S3-Compatible Storage)
  # Production uses Supabase Storage
  # ─────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: lernyxa-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: lernyxa_minio
      MINIO_ROOT_PASSWORD: lernyxa_minio_secret
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - lernyxa

  # ─────────────────────────────────────────────
  # Mailpit (Local SMTP Mail Capture)
  # Production uses Resend
  # ─────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: lernyxa-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    networks:
      - lernyxa

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  lernyxa:
    driver: bridge
